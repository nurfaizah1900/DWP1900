<script>
  const APP_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzLPHlAcRQmll0_MpM94Lcc8rRVBpNpSGXrzNcpYSxfWMLbzDoxlC-E0yXIgpF6WhbK/exec";

  document.addEventListener("DOMContentLoaded", function() {
    loadData();
  });

  function loadData() {
    let script = document.createElement('script');
    script.src = `${APP_SCRIPT_URL}?callback=renderData`;
    script.onerror = function() {
      document.getElementById('table-jadwal').innerHTML = 
        `<tr><td colspan="5" class="text-center text-danger p-4">
          <i class="fa-solid fa-circle-exclamation me-2"></i>Gagal terhubung ke Google Apps Script.
        </td></tr>`;
      document.getElementById('cards-kegiatan').innerHTML = 
        `<div class="col-12 text-center text-danger p-4">Gagal memuat dokumentasi.</div>`;
    };
    document.body.appendChild(script);
  }

  // Format URL Gambar dari Google Drive
  function formatDriveUrl(url) {
    if (!url || typeof url !== 'string' || !url.includes('http')) {
      return 'https://via.placeholder.com/400x220?text=Dokumentasi+DWP';
    }
    if (url.includes('drive.google.com')) {
      let match = url.match(/[\w-]{25,}/);
      if (match) {
        return 'https://lh3.googleusercontent.com/d/' + match[0];
      }
    }
    return url;
  }

  // Format Tanggal
  function formatDate(dateStr) {
    if (!dateStr) return '-';
    let date = new Date(dateStr);
    if (isNaN(date.getTime())) return dateStr;
    return date.toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
  }

  // Menampilkan Data ke Tabel dan Card
  function renderData(response) {
    let data = Array.isArray(response) ? response : (response && response.data ? response.data : []);
    
    const tbody = document.getElementById('table-jadwal');
    const cardsContainer = document.getElementById('cards-kegiatan');

    if (!data || data.length === 0) {
      tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted p-4">Belum ada agenda kegiatan.</td></tr>';
      cardsContainer.innerHTML = '<div class="col-12 text-center text-muted p-4">Belum ada dokumentasi.</div>';
      return;
    }

    let tableHtml = '';
    let cardsHtml = '';

    data.forEach(item => {
      // Pembacaan kolom sesuai header di Excel Anda
      let judul = item['Judul Kegiatan'] || '-';
      let bidang = item['Bidang'] || '-';
      let tgl = formatDate(item['Tanggal']);
      let waktu = item['Waktu'] || '';
      let tempat = item['Lokasi'] || '-';
      let deskripsi = item['Deskripsi'] || '-';
      let status = item['Status'] || 'Selesai';
      let imgUrl = formatDriveUrl(item['URL Foto Highlight']);

      // 1. Isi Tabel Agenda
      tableHtml += `
        <tr>
          <td class="fw-bold text-dark">${judul}</td>
          <td><span class="badge bg-success">${tgl}</span> <small class="text-muted">${waktu}</small></td>
          <td>${tempat}</td>
          <td><span class="badge bg-secondary">${bidang}</span></td>
          <td>${deskripsi}</td>
        </tr>
      `;

      // 2. Isi Card Dokumentasi
      cardsHtml += `
        <div class="col-md-4">
          <div class="card h-100 shadow-sm border-0">
            <img src="${imgUrl}" 
                 class="card-img-top" 
                 alt="${judul}" 
                 onerror="this.onerror=null; this.src='https://via.placeholder.com/400x220?text=Foto+Tidak+Tersedia';">
            <div class="card-body">
              <div class="d-flex justify-content-between align-items-center mb-2">
                <small class="text-success fw-bold">${tgl}</small>
                <span class="badge bg-light text-dark border">${status}</span>
              </div>
              <h5 class="card-title fw-bold text-dark">${judul}</h5>
              <p class="card-text text-secondary small">${deskripsi}</p>
            </div>
            <div class="card-footer bg-transparent border-0 pb-3">
              <small class="text-muted"><i class="fa-solid fa-location-dot me-1"></i> ${tempat}</small>
            </div>
          </div>
        </div>
      `;
    });

    tbody.innerHTML = tableHtml;
    cardsContainer.innerHTML = cardsHtml;
  }
</script>
